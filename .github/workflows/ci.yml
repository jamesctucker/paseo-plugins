name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [agent-board, nested-changes, review-queue, code-quiz, macos-classic-theme]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.plugin }}/package-lock.json
      - name: Install
        working-directory: ${{ matrix.plugin }}
        run: npm ci
      - name: Typecheck
        working-directory: ${{ matrix.plugin }}
        run: npm run typecheck
      - name: Test
        working-directory: ${{ matrix.plugin }}
        run: npm test --if-present
